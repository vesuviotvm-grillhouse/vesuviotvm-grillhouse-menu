<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a71919" />
    <meta
      name="description"
      content="View the Vesuvio Grill House digital menu."
    />

    <title>Vesuvio Grill House | Digital Menu</title>

    <style>
      :root {
        --red: #a71919;
        --deep-red: #781010;
        --cream: #fff8e9;
        --ink: #321b16;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: #f4ead8;
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(255, 248, 233, 0.97);
        border-bottom: 2px solid var(--red);
        padding: 13px 16px;
        text-align: center;
        backdrop-filter: blur(8px);
      }

      .brand-logo {
        display: block;
        width: min(100%, 460px);
        height: auto;
        max-height: 150px;
        object-fit: contain;
        margin: 0 auto;
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 18px 12px 30px;
      }

      .intro {
        text-align: center;
        margin: 4px 0 16px;
      }

      .intro h2 {
        margin: 0 0 5px;
        color: #a71919;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
      }

      .intro p {
        margin: 0;
        color: #a71919;
        font-size: 13px;
      }

      .menu-page {
        margin: 0 auto 20px;
        background: var(--cream);
        border: 1px solid #e1c9a7;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 5px 18px rgba(67, 35, 16, 0.13);
      }

      .menu-page img {
        display: block;
        width: 100%;
        height: auto;
        cursor: zoom-in;
      }

      .menu-page img:focus-visible {
        outline: 3px solid #e0a52b;
        outline-offset: -3px;
      }

      .page-label {
        padding: 10px;
        text-align: center;
        color: var(--deep-red);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* Footer */

      footer {
        text-align: center;
        padding: 24px 12px 30px;
        color: var(--red);
        font-size: 13px;
        line-height: 1.8;
      }

      .footer-brand {
        display: block;
        width: fit-content;
        max-width: 100%;
        margin: 0 auto 8px;
        text-decoration: none;
      }

      .footer-logo {
        display: block;
        width: min(280px, 75vw);
        height: auto;
        max-height: 130px;
        object-fit: contain;
        margin: 0 auto;
      }

      .footer-location {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 0 auto 8px;
        color: var(--red);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }

      .footer-social {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-top: 8px;
      }

      .footer-social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: var(--red);
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
      }

      .footer-location:hover,
      .footer-social a:hover {
        color: var(--deep-red);
        opacity: 0.8;
      }

      .footer-location:focus-visible,
      .footer-social a:focus-visible,
      .footer-brand:focus-visible {
        outline: 3px solid #e0a52b;
        outline-offset: 4px;
        border-radius: 4px;
      }

      .footer-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        fill: currentColor;
      }

      /* Fullscreen menu viewer */

      .viewer {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.94);
        align-items: center;
        justify-content: center;
        padding: 55px 8px 16px;
      }

      .viewer.open {
        display: flex;
      }

      .viewer img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        cursor: zoom-out;
      }

      .close-viewer {
        position: absolute;
        top: 12px;
        right: 12px;
        border: 0;
        border-radius: 8px;
        background: white;
        color: #222;
        font-size: 26px;
        line-height: 1;
        padding: 9px 15px;
        cursor: pointer;
      }

      .close-viewer:hover {
        background: #f0e5d5;
      }

      @media (min-width: 700px) {
        main {
          padding-top: 25px;
        }

        .menu-page {
          margin-bottom: 25px;
        }
      }

      @media (max-width: 400px) {
        header {
          padding: 10px 12px;
        }

        .brand-logo {
          max-height: 115px;
        }

        .intro h2 {
          font-size: 22px;
        }

        .footer-logo {
          width: min(240px, 75vw);
        }
      }
    </style>
  </head>

  <body>
    <!-- Header with hotel logo -->
    <header>
      <img
        class="brand-logo"
        src="images/vesuvio-logo.png"
        alt="Vesuvio Grill House logo"
      />
    </header>

    <!-- Menu content -->
    <main>
      <section class="intro">
        <h2>Our Menu</h2>
        <p>Fresh off the grill. Explore our food and beverages.</p>
      </section>

      <section class="menu-page" id="page-1" aria-label="Menu page 1">
        <img
          src="images/menu-page-1.jpg"
          alt="Vesuvio Grill House menu page 1"
          loading="eager"
          onclick="openViewer(this.src, this.alt)"
          onkeydown="
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openViewer(this.src, this.alt);
            }
          "
          tabindex="0"
          role="button"
          aria-label="Enlarge menu page 1"
        />
        <div class="page-label">Menu · Page 1</div>
      </section>

      <section class="menu-page" id="page-2" aria-label="Menu page 2">
        <img
          src="images/menu-page-2.jpg"
          alt="Vesuvio Grill House menu page 2"
          loading="lazy"
          onclick="openViewer(this.src, this.alt)"
          onkeydown="
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openViewer(this.src, this.alt);
            }
          "
          tabindex="0"
          role="button"
          aria-label="Enlarge menu page 2"
        />
        <div class="page-label">Menu · Page 2</div>
      </section>
    </main>

    <!-- Footer with logo, location and Instagram -->
    <footer>
      <a
        class="footer-brand"
        href="https://www.instagram.com/vesuviotvm/?__d=1"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Vesuvio Grill House on Instagram"
      >
        <img
          class="footer-logo"
          src="images/vesuvio-logo.png"
          alt="Vesuvio Grill House"
          loading="lazy"
        />
      </a>

      <a
        class="footer-location"
        href="https://www.google.com/maps/dir//Vesuvio,+Junction,+Jagathy,+Thiruvananthapuram,+Keralam+695014/@8.5164032,76.9779994,15z/data=!4m8!4m7!1m0!1m5!1m1!1s0x3b05bbe5fd5a2f8f:0x3788f1d1aea80365!2m2!1d76.9644372!2d8.4942268?entry=ttu&amp;g_ep=EgoyMDI2MTExOC4xIKXMDSoASAFQAw%3D%3D"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Get directions to Vesuvio Grill House in Jagathy, Trivandrum"
      >
        <!-- Location pin icon -->
        <svg class="footer-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"
          />
        </svg>

        Located in Jagathy, Trivandrum
      </a>

      <div class="footer-social">
        <a
          href="https://www.instagram.com/vesuviotvm/?__d=1"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow Vesuvio Grill House on Instagram"
        >
          <!-- Instagram icon -->
          <svg class="footer-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7zm5 2.3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2.2a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6zm5.7-3.3a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z"
            />
          </svg>

          Follow us on Instagram
        </a>
      </div>
    </footer>

    <!-- Fullscreen image viewer -->
    <div
      class="viewer"
      id="viewer"
      role="dialog"
      aria-modal="true"
      aria-label="Full screen menu image"
      aria-hidden="true"
      onclick="closeViewer()"
    >
      <button
        class="close-viewer"
        type="button"
        aria-label="Close image"
        onclick="closeViewer()"
      >
        &times;
      </button>

      <img
        id="viewer-image"
        src=""
        alt="Enlarged menu"
        onclick="event.stopPropagation()"
      />
    </div>

    <script>
      function scrollToPage(number) {
        const page = document.getElementById("page-" + number);

        if (page) {
          page.scrollIntoView({ behavior: "smooth" });
        }
      }

      function openViewer(source, description) {
        const viewer = document.getElementById("viewer");
        const viewerImage = document.getElementById("viewer-image");

        viewerImage.src = source;
        viewerImage.alt = description || "Enlarged menu";
        viewer.classList.add("open");
        viewer.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";

        document.querySelector(".close-viewer").focus();
      }

      function closeViewer() {
        const viewer = document.getElementById("viewer");

        viewer.classList.remove("open");
        viewer.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeViewer();
        }
      });
    </script>
  </body>
</html>
